<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HomeRun</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0a">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HomeRun">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <style>
    :root {
      --bg: #0a0a0a;
      --bg2: #141414;
      --bg3: #1e1e1e;
      --text: #f0f0f0;
      --muted: #888;
      --subtle: #555;
      --accent: #c8f135;
      --accent-dim: rgba(200,241,53,0.12);
      --red: #ff5a5a;
      --red-dim: rgba(255,90,90,0.12);
      --green: #4ade80;
      --green-dim: rgba(74,222,128,0.12);
      --border: rgba(255,255,255,0.07);
      --radius: 14px;
      --radius-sm: 9px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif;
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px);
      display: flex;
      flex-direction: column;
      max-width: 430px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .logo span { color: var(--accent); }

    .gps-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      background: var(--bg3);
      padding: 5px 10px;
      border-radius: 99px;
    }
    .gps-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--subtle);
      transition: background 0.3s;
    }
    .gps-dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }

    /* Main distance card */
    .home-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px 20px;
      text-align: center;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }
    .home-card::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
    }
    .home-card-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .home-card-value {
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -3px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .home-card-value.far { color: var(--accent); }
    .home-card-unit {
      font-size: 22px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0;
    }
    .home-card-sub {
      font-size: 11px;
      color: var(--subtle);
      margin-top: 10px;
    }
    .home-card-sub.set { color: var(--green); }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .stat-unit {
      font-size: 13px;
      color: var(--muted);
      font-weight: 400;
    }

    /* Buttons */
    .btn-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn {
      padding: 16px 8px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      transition: opacity 0.15s, transform 0.1s;
      width: 100%;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.97); opacity: 0.8; }
    .btn-start {
      background: var(--accent);
      color: #0a0a0a;
      border-color: transparent;
    }
    .btn-stop {
      background: var(--red-dim);
      color: var(--red);
      border-color: rgba(255,90,90,0.25);
    }
    .btn-home-set { background: var(--green-dim); color: var(--green); border-color: rgba(74,222,128,0.2); }
    .btn-reset {
      width: 100%;
      padding: 12px;
      font-size: 13px;
      color: var(--subtle);
      border-color: transparent;
      background: transparent;
    }

    .alert {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .alert-warn { background: rgba(255,180,0,0.12); color: #ffb400; }
    .alert-ok { background: var(--green-dim); color: var(--green); }
    .alert-info { background: rgba(100,160,255,0.12); color: #64a0ff; }

    footer {
      margin-top: auto;
      padding-top: 16px;
      text-align: center;
      font-size: 11px;
      color: var(--subtle);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Home<span>Run</span></div>
  <div class="gps-pill">
    <div class="gps-dot" id="gps-dot"></div>
    <span id="gps-label">GPS</span>
  </div>
</header>

<div id="alert-box"></div>

<div class="home-card">
  <div class="home-card-label">distancia a casa</div>
  <div class="home-card-value" id="home-dist">—<span class="home-card-unit"></span></div>
  <div class="home-card-sub" id="home-sub">Marca tu casa antes de salir</div>
</div>

<div class="stats-grid">
  <div class="stat">
    <div class="stat-label">Recorrido</div>
    <div class="stat-value" id="total-km">0.00 <span class="stat-unit">km</span></div>
  </div>
  <div class="stat">
    <div class="stat-label">Tiempo</div>
    <div class="stat-value" id="elapsed">00:00</div>
  </div>
  <div class="stat">
    <div class="stat-label">Ritmo</div>
    <div class="stat-value" id="pace">— <span class="stat-unit">'/km</span></div>
  </div>
  <div class="stat">
    <div class="stat-label">Velocidad</div>
    <div class="stat-value" id="speed">— <span class="stat-unit">km/h</span></div>
  </div>
</div>

<div class="btn-row">
  <button class="btn btn-start" id="btn-run" onclick="toggleRun()">Iniciar</button>
  <button class="btn" id="btn-home" onclick="setHome()">Marcar casa</button>
</div>
<button class="btn btn-reset" onclick="resetSession()">Reiniciar sesión</button>

<footer>Distancia en línea recta · GPS del dispositivo</footer>

<script>
var watchId=null,isRunning=false,homePos=null,lastPos=null;
var totalKm=0,startTs=null,timerTick=null;

function hav(a,b,c,d){
  var dA=(c-a)*Math.PI/180,dB=(d-b)*Math.PI/180;
  var x=Math.sin(dA/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dB/2)**2;
  return 6371*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function pad(n){return String(n).padStart(2,'0');}
function fmt(ms){
  var s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);
  return h>0?h+':'+pad(m%60)+':'+pad(s%60):pad(m)+':'+pad(s%60);
}
function setAlert(msg,type){
  var el=document.getElementById('alert-box');
  el.innerHTML=msg?'<div class="alert alert-'+type+'">'+msg+'</div>':'';
}

function onPos(pos){
  var lat=pos.coords.latitude,lon=pos.coords.longitude,spd=pos.coords.speed,acc=pos.coords.accuracy;
  document.getElementById('gps-dot').classList.add('on');
  document.getElementById('gps-label').textContent='GPS ±'+Math.round(acc||0)+'m';

  if(spd!=null){
    var kmh=spd*3.6;
    document.getElementById('speed').innerHTML=kmh.toFixed(1)+' <span class="stat-unit">km/h</span>';
    if(kmh>0.8){
      var pm=60/kmh,m=Math.floor(pm),s=Math.round((pm-m)*60);
      document.getElementById('pace').innerHTML=m+':'+pad(s)+' <span class="stat-unit">\'/km</span>';
    } else {
      document.getElementById('pace').innerHTML='— <span class="stat-unit">\'/km</span>';
    }
  }

  if(isRunning&&lastPos){
    var d=hav(lastPos.lat,lastPos.lon,lat,lon);
    if(d>0.003) totalKm+=d;
  }
  if(isRunning) lastPos={lat:lat,lon:lon};
  document.getElementById('total-km').innerHTML=totalKm.toFixed(2)+' <span class="stat-unit">km</span>';

  if(homePos){
    var dh=hav(homePos.lat,homePos.lon,lat,lon);
    var valEl=document.getElementById('home-dist');
    if(dh<0.05){
      valEl.innerHTML='<span style="color:var(--green)">¡En casa!</span>';
    } else if(dh<1){
      valEl.innerHTML=(dh*1000).toFixed(0)+'<span class="home-card-unit"> m</span>';
    } else {
      valEl.className='home-card-value'+(dh>3?' far':'');
      valEl.innerHTML=dh.toFixed(2)+'<span class="home-card-unit"> km</span>';
    }
  }
}

function onErr(e){
  document.getElementById('gps-dot').classList.remove('on');
  var m='Error GPS.';
  if(e.code===1) m='Permiso GPS denegado. Ve a Ajustes → Safari → Ubicación.';
  else if(e.code===2) m='GPS no disponible. Sal al exterior.';
  else if(e.code===3) m='Timeout GPS. ¿Tienes señal?';
  setAlert(m,'warn');
}

function toggleRun(){
  isRunning?stopRun():startRun();
}
function startRun(){
  if(!navigator.geolocation){setAlert('GPS no soportado.','warn');return;}
  isRunning=true;startTs=Date.now();lastPos=null;totalKm=0;
  var b=document.getElementById('btn-run');
  b.textContent='Parar';b.className='btn btn-stop';
  setAlert(null);
  timerTick=setInterval(function(){
    document.getElementById('elapsed').textContent=fmt(Date.now()-startTs);
  },1000);
  watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
}
function stopRun(){
  isRunning=false;
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  clearInterval(timerTick);timerTick=null;
  var b=document.getElementById('btn-run');
  b.textContent='Iniciar';b.className='btn btn-start';
  document.getElementById('gps-dot').classList.remove('on');
  document.getElementById('gps-label').textContent='GPS';
}
function setHome(){
  if(!navigator.geolocation){setAlert('GPS no soportado.','warn');return;}
  setAlert('Obteniendo posición GPS...','info');
  navigator.geolocation.getCurrentPosition(function(pos){
    homePos={lat:pos.coords.latitude,lon:pos.coords.longitude};
    document.getElementById('home-sub').textContent='Casa marcada ✓';
    document.getElementById('home-sub').className='home-card-sub set';
    document.getElementById('btn-home').className='btn btn-home-set';
    document.getElementById('btn-home').textContent='Casa ✓';
    setAlert(null);
  },onErr,{enableHighAccuracy:true,timeout:15000});
}
function resetSession(){
  stopRun();
  totalKm=0;startTs=null;lastPos=null;
  document.getElementById('home-dist').innerHTML='—<span class="home-card-unit"></span>';
  document.getElementById('total-km').innerHTML='0.00 <span class="stat-unit">km</span>';
  document.getElementById('elapsed').textContent='00:00';
  document.getElementById('pace').innerHTML='— <span class="stat-unit">\'/km</span>';
  document.getElementById('speed').innerHTML='— <span class="stat-unit">km/h</span>';
  setAlert(null);
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(function(){});
}
</script>
</body>
</html>
